name: CI

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRICE_MONITOR_ENV: development
  PRICE_MONITOR_HOST: 127.0.0.1
  PRICE_MONITOR_TEAM_MODE: 'false'
  PRICE_MONITOR_DB_BACKEND: sqlite
  PRICE_MONITOR_API_KEY: ''
  PRICE_MONITOR_DEMO: 'false'
  PRICE_MONITOR_RATE_LIMIT_ENABLED: 'false'

jobs:
  test:
    name: Python ${{ matrix.python-version }} and interface regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python -m pip install -e '.[test,analysis]'
      - run: python -m pytest -m 'not browser' -W error::pytest.PytestUnhandledThreadExceptionWarning --junitxml=test-results/python.xml
      - run: node --test tests/*.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: python-${{ matrix.python-version }}
          path: test-results/

  mysql:
    name: MySQL 8.4 migrations and business regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdisposable-ci-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      RUN_MYSQL_TESTS: '1'
      PRICE_MONITOR_TEST_MYSQL: '1'
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: pm_test_ci_schema
      MYSQL_USER: root
      MYSQL_PASSWORD: disposable-ci-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests/test_mysql.py tests/test_backend_contract.py --junitxml=test-results/mysql.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mysql-results
          path: test-results/

  browser:
    name: Chromium user journeys and offline charts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test,browser]'
      - run: python -m playwright install --with-deps --no-shell chromium
      - run: python -m pytest tests/test_browser_journeys.py --junitxml=test-results/browser.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-results
          path: test-results/

  package:
    name: Build and verify package and container
    runs-on: ubuntu-latest
    needs: [test, mysql, browser]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/check_delivery.py --wheel dist/*.whl
      - run: docker build --tag price-monitor:ci .
